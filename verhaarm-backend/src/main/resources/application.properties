spring.application.name=verhaarm-backend
verhaarm.sessions.revokedDeleteAfterMinutes=10
verhaarm.sessions.cleanupFixedDelayMs=60000

# nginx (client_max_body_size) allows up to 50m; keep these comfortably under that.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
