# .github/workflows/deploy.yml
name: Build & Deploy Backend (Verbose Debug)

on:
  workflow_dispatch:

concurrency:
  group: verhaaarm-backend-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven Wrapper
        working-directory: verhaarm-backend
        shell: bash
        run: |
          set -euo pipefail
          echo "== Maven build =="
          java -version
          chmod +x ./mvnw
          ./mvnw -B clean package -DskipTests
          echo "== Target directory contents =="
          ls -lah target || true

      - name: Prepare SSH key + host key (base64, verbose)
        shell: bash
        run: |
          set -euo pipefail

          echo "== Runner info =="
          whoami
          uname -a
          ssh -V || true
          openssl version || true

          echo "== Write private key from base64 secret to ~/.ssh/id_ed25519 =="
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "== Key file byte count (should be much larger than 418) =="
          wc -c ~/.ssh/id_ed25519

          echo "== Parse key (must succeed) =="
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          echo "== Private key fingerprint (safe) =="
          ssh-keygen -lf ~/.ssh/id_ed25519

          echo "== known_hosts for VPS (ssh-keyscan) =="
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" 2>/dev/null | tee -a ~/.ssh/known_hosts >/dev/null
          wc -l ~/.ssh/known_hosts


      - name: Upload JAR to VPS (/tmp/verhaarm.jar) (scp -vvv)
        shell: bash
        run: |
          set -euo pipefail

          echo "== Pick JAR artifact (avoid .original) =="
          JAR_PATH="$(ls -1 verhaarm-backend/target/verhaarm-backend-*.jar | grep -v '\.original$' | head -n 1)"
          if [ -z "${JAR_PATH:-}" ]; then
            echo "ERROR: Could not find built JAR under verhaarm-backend/target/"
            ls -lah verhaarm-backend/target || true
            exit 1
          fi
          echo "Uploading: ${JAR_PATH}"
          ls -lah "${JAR_PATH}"

          echo "== scp verbose output =="
          scp -vvv \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${JAR_PATH}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/verhaarm.jar"

      - name: Remote preflight (ssh -vvv)
        shell: bash
        run: |
          set -euo pipefail
          echo "== SSH connectivity test (verbose) =="
          ssh -vvv \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -euo pipefail
             echo "Connected as: $(whoami)"
             echo "Host: $(hostname)"
             echo "Java (systemd will use /usr/bin/java on server):"
             /usr/bin/java -version || true
             echo "sudo rights check:"
             sudo -n true && echo "sudo non-interactive: OK" || (echo "sudo non-interactive: FAILED" && exit 1)
             echo "Service status (short):"
             systemctl is-active verhaarm || true'

      - name: Restart service on VPS (deploy)
        shell: bash
        run: |
          set -euo pipefail
          echo "== Deploy + restart =="
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -euo pipefail
             sudo systemctl stop verhaarm
             sudo mv /tmp/verhaarm.jar /opt/verhaarm/app.jar
             sudo chown root.root /opt/verhaarm/app.jar
             sudo chmod 755 /opt/verhaarm/app.jar
             sudo systemctl start verhaarm
             echo "Started. systemctl status (no pager):"
             systemctl status verhaarm --no-pager -l | sed -n "1,80p"'
