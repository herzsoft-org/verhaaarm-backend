name: Build & Deploy Backend

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: verhaaarm-backend-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven Wrapper
        working-directory: verhaarm-backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean package -DskipTests

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload JAR to VPS (/tmp/verhaarm.jar)
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            verhaarm-backend/target/*.jar \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/verhaarm.jar"

      - name: Restart service on VPS
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -euo pipefail
             sudo systemctl stop verhaarm
             sudo mv /tmp/verhaarm.jar /opt/verhaarm/app.jar
             sudo chown root:root /opt/verhaarm/app.jar
             sudo chmod 755 /opt/verhaarm/app.jar
             sudo systemctl start verhaarm'
